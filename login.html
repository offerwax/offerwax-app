<script>

/* =========================================
   OFFERWAX REAL API
========================================= */

const API_BASE =
"https://offerwax-api.technicalbikash59.workers.dev";


/* =========================================
   REGISTER / LOGIN TABS
========================================= */

function showRegister(){

  document
    .getElementById("registerForm")
    .classList.add("active");

  document
    .getElementById("loginForm")
    .classList.remove("active");

  document
    .getElementById("registerTab")
    .classList.add("active");

  document
    .getElementById("loginTab")
    .classList.remove("active");
}


function showLogin(){

  document
    .getElementById("loginForm")
    .classList.add("active");

  document
    .getElementById("registerForm")
    .classList.remove("active");

  document
    .getElementById("loginTab")
    .classList.add("active");

  document
    .getElementById("registerTab")
    .classList.remove("active");
}


/* =========================================
   SHOW PASSWORD
========================================= */

function togglePassword(id,button){

  const input =
    document.getElementById(id);

  if(input.type === "password"){

    input.type = "text";
    button.innerText = "HIDE";

  }else{

    input.type = "password";
    button.innerText = "SHOW";
  }
}


/* =========================================
   MOBILE VALIDATION
========================================= */

function validMobile(number){

  return /^[6-9][0-9]{9}$/.test(number);
}


/* =========================================
   REGISTER - REAL D1 DATABASE
========================================= */

async function registerUser(event){

  event.preventDefault();

  const button =
    event.target.querySelector(".main-btn");

  const originalText =
    button.innerText;


  const name =
    document
      .getElementById("fullName")
      .value
      .trim();

  const mobile =
    document
      .getElementById("registerMobile")
      .value
      .trim();

  const password =
    document
      .getElementById("registerPassword")
      .value;

  const confirm =
    document
      .getElementById("confirmPassword")
      .value;

  const referralCode =
    document
      .getElementById("referralCode")
      .value
      .trim();

  const terms =
    document
      .getElementById("terms")
      .checked;


  if(name.length < 2){

    alert("Please enter your full name.");
    return;
  }


  if(!validMobile(mobile)){

    alert(
      "Please enter a valid 10-digit mobile number."
    );

    return;
  }


  if(password.length < 6){

    alert(
      "Password must contain at least 6 characters."
    );

    return;
  }


  if(password !== confirm){

    alert("Passwords do not match.");
    return;
  }


  if(!terms){

    alert(
      "Please accept Terms and Privacy Policy."
    );

    return;
  }


  try{

    button.disabled = true;
    button.innerText = "Creating Account...";


    const response =
      await fetch(
        API_BASE + "/api/register",
        {
          method:"POST",

          headers:{
            "Content-Type":"application/json"
          },

          body:JSON.stringify({

            name:name,

            mobile:mobile,

            password:password,

            referral_code:
              referralCode || null
          })
        }
      );


    const data =
      await response.json();


    if(!response.ok || !data.success){

      alert(
        data.message ||
        "Registration failed. Please try again."
      );

      return;
    }


    /*
      Save only normal session/user data.
      Password is NEVER stored here.
    */

    if(data.token){

      localStorage.setItem(
        "offerwax_token",
        data.token
      );
    }


    if(data.user){

      localStorage.setItem(
        "offerwax_user",
        JSON.stringify(data.user)
      );
    }


    localStorage.setItem(
      "offerwax_logged_in",
      "true"
    );


    alert(
      data.message ||
      "Account created successfully!"
    );


    window.location.href =
      "index.html";


  }catch(error){

    console.error(error);

    alert(
      "Unable to connect to Offerwax. Please check your internet and try again."
    );


  }finally{

    button.disabled = false;
    button.innerText = originalText;
  }
}


/* =========================================
   LOGIN - REAL DATABASE
========================================= */

async function loginUser(event){

  event.preventDefault();

  const button =
    event.target.querySelector(".main-btn");

  const originalText =
    button.innerText;


  const mobile =
    document
      .getElementById("loginMobile")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;


  if(!validMobile(mobile)){

    alert(
      "Please enter a valid mobile number."
    );

    return;
  }


  if(!password){

    alert(
      "Please enter your password."
    );

    return;
  }


  try{

    button.disabled = true;
    button.innerText = "Logging in...";


    const response =
      await fetch(
        API_BASE + "/api/login",
        {
          method:"POST",

          headers:{
            "Content-Type":"application/json"
          },

          body:JSON.stringify({

            mobile:mobile,

            password:password
          })
        }
      );


    const data =
      await response.json();


    if(!response.ok || !data.success){

      alert(
        data.message ||
        "Invalid mobile number or password."
      );

      return;
    }


    /*
      Store authentication token.
      Never store password.
    */

    if(data.token){

      localStorage.setItem(
        "offerwax_token",
        data.token
      );
    }


    if(data.user){

      localStorage.setItem(
        "offerwax_user",
        JSON.stringify(data.user)
      );
    }


    localStorage.setItem(
      "offerwax_logged_in",
      "true"
    );


    window.location.href =
      "index.html";


  }catch(error){

    console.error(error);

    alert(
      "Unable to connect to Offerwax. Please check your internet and try again."
    );


  }finally{

    button.disabled = false;
    button.innerText = originalText;
  }
}


/* =========================================
   FORGOT PASSWORD
========================================= */

function forgotPassword(event){

  event.preventDefault();

  alert(
    "Password recovery will be available soon."
  );
}


/* =========================================
   REFERRAL LINK
========================================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const ref =
  params.get("ref");


if(ref){

  document
    .getElementById("referralCode")
    .value = ref;

}


/* =========================================
   WITHDRAWAL MOVEMENT
========================================= */

const withdrawList =
  document.getElementById(
    "withdrawList"
  );


if(withdrawList){

  const withdrawRows =
    withdrawList.querySelectorAll(
      ".withdraw-row"
    );

  let currentWithdraw = 0;


  setInterval(function(){

    currentWithdraw++;


    if(
      currentWithdraw >
      withdrawRows.length - 4
    ){

      currentWithdraw = 0;
    }


    withdrawList.style.transform =
      "translateY(-" +
      (currentWithdraw * 54) +
      "px)";

  },2800);
}

                      </script>
